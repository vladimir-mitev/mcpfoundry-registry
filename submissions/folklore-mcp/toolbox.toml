[tool]
name = "folklore-mcp"
version = "1.4.2"
description = "Official public, read-only Helena Bioinformatics MCP for germline variant evidence, ACMG/AMP decision support, provenance and semantic scientific-literature search."
author = "Helena Bioinformatics"
homepage = "https://github.com/helena-bioinformatics/folklore-mcp"
license = "Apache-2.0"

# The source adapter entry starts an HTTP ASGI server, not a stdio MCP process.
# Hosted connection and installer compatibility are documented in README.md.
[binary]
entry = "folklore-mcp"
platforms = ["darwin-arm64", "darwin-x64", "linux-x64"]

[runtime]
transport = "streamable-http"
runtime = "python"
min_version = "3.12"

[permissions]
filesystem = false
network = ["https://api.helena.bio"]
env_vars = ["FOLKLORE_MCP_ENABLED", "FOLKLORE_LITERATURE_ENABLED"]
allow_exec = false
max_memory_mb = 256
max_cpu_percent = 60

[[mcp.tools]]
name = "search_variant_evidence"
description = "Resolve one supported GRCh38 germline SNV or simple indel and return public Folklore evidence with provenance and ACMG/AMP decision support."

[[mcp.tools]]
name = "search_variant_literature"
description = "Retrieve related publications from the public PubMed-derived Folklore genetics corpus; literature associations do not alter classification."

[[mcp.tools]]
name = "get_publication_details"
description = "Return one complete public bibliographic record for a PMID produced by Folklore literature search."

[[mcp.tools]]
name = "search_literature_corpus"
description = "Semantically search public scientific literature with natural language, PMID, DOI, PMCID, gene, variant, phenotype, HPO or OMIM anchors."
